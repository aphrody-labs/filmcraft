[package]
name = "filmcraft-cli"
description = "FilmCraft headless CLI and MCP server"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[[bin]]
name = "filmcraft-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]

[dependencies]
filmcraft-engine = { path = "../../crates/engine", version = "0.9.0" }
filmcraft-export = { path = "../../crates/export", version = "0.9.0" }
filmcraft-project = { path = "../../crates/project", version = "0.9.0" }
filmcraft-render = { path = "../../crates/render", version = "0.9.0" }
filmcraft-time = { path = "../../crates/time", version = "0.9.0" }
filmcraft-gpu = { path = "../../crates/gpu", version = "0.9.0" }
filmcraft-media = { path = "../../crates/media", version = "0.9.0" }
filmcraft-codecs = { path = "../../crates/codecs", version = "0.9.0" }
filmcraft-platform = { path = "../../crates/platform", version = "0.9.0" }
filmcraft-mxf = { path = "../../crates/mxf", version = "0.9.0" }
filmcraft-mpegts = { path = "../../crates/mpegts", version = "0.9.0" }
filmcraft-ogg = { path = "../../crates/ogg", version = "0.9.0" }
filmcraft-automation = { path = "../../crates/automation", version = "0.9.0" }
serde_json = { version = "1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
filmcraft-testkit = { path = "../../crates/testkit" }
