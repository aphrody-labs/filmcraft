[package]
name = "filmcraft-web"
description = "FilmCraft in the browser (wasm32): eframe web runner, WebGPU/WebGL2, Blob media, OPFS, WebAudio, WebCodecs"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm32-only: on other targets this crate is empty (so `cargo test --workspace`
# and clippy stay cheap). Build with `cargo xtask web` (see docs/web.md).
[target.'cfg(target_arch = "wasm32")'.dependencies]
filmcraft-engine = { path = "../../crates/engine" }
filmcraft-ui-egui = { path = "../../crates/ui-egui" }
filmcraft-media = { path = "../../crates/media" }
filmcraft-codecs = { path = "../../crates/codecs" }
filmcraft-frame = { path = "../../crates/frame" }
filmcraft-color = { path = "../../crates/color" }
filmcraft-isobmff = { path = "../../crates/isobmff" }
filmcraft-format = { path = "../../crates/format" }
filmcraft-time = { path = "../../crates/time" }
egui = { version = "0.36" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu"] }
serde_json = { version = "1" }
log = { version = "0.4" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-time = "1"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioContextOptions",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemWritableFileStream",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "ImageData",
    "Location",
    "MessageEvent",
    "MessagePort",
    "Navigator",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "Performance",
    "Response",
    "StorageManager",
    "Url",
    "UrlSearchParams",
    "Window",
    "WritableStream",
] }
