[package]
name = "filmcraft-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
filmcraft-time = { path = "../time" }
filmcraft-color = { path = "../color" }
filmcraft-frame = { path = "../frame" }
filmcraft-media = { path = "../media" }
filmcraft-avi = { path = "../avi" }
filmcraft-isobmff = { path = "../isobmff" }
filmcraft-matroska = { path = "../matroska" }
filmcraft-mxf = { path = "../mxf" }
filmcraft-mpegts = { path = "../mpegts" }
filmcraft-mpeg2v = { path = "../mpeg2v" }
filmcraft-ac3 = { path = "../ac3" }
filmcraft-mpa = { path = "../mpa" }
filmcraft-ogg = { path = "../ogg" }
filmcraft-bitstream = { path = "../bitstream" }
filmcraft-h264 = { path = "../h264" }
filmcraft-hevc = { path = "../hevc" }
filmcraft-vp8 = { path = "../vp8" }
filmcraft-vp9 = { path = "../vp9" }
filmcraft-prores = { path = "../prores" }
filmcraft-dnx = { path = "../dnx" }
filmcraft-av1 = { path = "../av1" }
filmcraft-apv = { path = "../apv" }
filmcraft-aac = { path = "../aac" }
filmcraft-opus = { path = "../opus" }
rayon = { version = "1" }
thiserror = { version = "2" }
log = { version = "0.4" }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
filmcraft-testkit = { path = "../testkit" }
serde_json = { version = "1" }
