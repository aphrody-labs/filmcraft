[package]
name = "filmcraft-engine"
description = "FilmCraft engine façade: session, command registry, history, media pool"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["filmcraft-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["filmcraft-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["filmcraft-tts/kokoro", "speech-download"]

[dependencies]
filmcraft-time = { path = "../time" }
filmcraft-geom = { path = "../geom" }
filmcraft-color = { path = "../color" }
filmcraft-frame = { path = "../frame" }
filmcraft-media = { path = "../media" }
filmcraft-codecs = { path = "../codecs" }
filmcraft-project = { path = "../project" }
filmcraft-edit = { path = "../edit" }
filmcraft-render = { path = "../render" }
filmcraft-scopes = { path = "../scopes" }
filmcraft-text = { path = "../text" }
filmcraft-audio-dsp = { path = "../audio-dsp" }
filmcraft-export = { path = "../export" }
filmcraft-mxf = { path = "../mxf" }
filmcraft-format = { path = "../format" }
filmcraft-interchange = { path = "../interchange" }
filmcraft-captions = { path = "../captions" }
filmcraft-speech = { path = "../speech" }
filmcraft-tts = { path = "../tts" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
log = { version = "0.4" }
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
web-time = "1"

[dev-dependencies]
filmcraft-testkit = { path = "../testkit" }
filmcraft-dng = { path = "../dng", features = ["writer"] }
filmcraft-isobmff = { path = "../isobmff" }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
