[package]
name = "filmcraft-tts"
description = "FilmCraft text to speech: the Voice trait, the voice catalogue, script parsing (pause markers), the built-in formant voice and (feature kokoro) Kokoro-82M neural voices on candle"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[features]
default = []
# Kokoro-82M neural voices on the CPU via candle (pure Rust). Off by default and in wasm builds.
kokoro = ["dep:candle-core", "dep:candle-nn", "dep:zip", "dep:serde_json", "dep:filmcraft-tts-text", "dep:filmcraft-audio-dsp"]

[dependencies]
filmcraft-tts-text = { path = "../tts-text", optional = true, version = "0.9.0" }
filmcraft-audio-dsp = { path = "../audio-dsp", optional = true, version = "0.9.0" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = { version = "2" }
candle-core = { version = "0.9", default-features = false, optional = true }
candle-nn = { version = "0.9", default-features = false, optional = true }
zip = { version = "7", default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[[example]]
name = "kokoro_say"
required-features = ["kokoro"]

[[example]]
name = "narrate"
required-features = ["kokoro"]
