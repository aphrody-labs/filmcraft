[package]
name = "filmcraft-captions"
description = "FilmCraft captions: SRT, WebVTT, SCC, MCC, EBU STL and TTML/IMSC1/DFXP import/export, caption layout and burn-in rasterisation"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
filmcraft-time = { path = "../time", version = "0.9.0" }
filmcraft-color = { path = "../color", version = "0.9.0" }
filmcraft-project = { path = "../project", version = "0.9.0" }
filmcraft-text = { path = "../text", version = "0.9.0" }
thiserror = { version = "2" }
roxmltree = { version = "0.21" }

[dev-dependencies]
proptest = { version = "1" }
