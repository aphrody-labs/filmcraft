[package]
name = "filmcraft-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
filmcraft-color = { path = "../color" }
filmcraft-frame = { path = "../frame" }
filmcraft-geom = { path = "../geom" }
filmcraft-project = { path = "../project" }
filmcraft-render = { path = "../render" }
filmcraft-time = { path = "../time" }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { version = "0.4" }
pollster = "0.4"
rayon = { version = "1" }

[dev-dependencies]
pollster = "0.4"
filmcraft-export = { path = "../export" }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
filmcraft-media = { path = "../media" }
filmcraft-time = { path = "../time" }
