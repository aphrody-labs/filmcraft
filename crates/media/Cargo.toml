[package]
name = "filmcraft-media"
description = "Media sources: probing, decoding traits, frame cache, generators, stills"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
filmcraft-time = { path = "../time", version = "0.9.0" }
filmcraft-color = { path = "../color", version = "0.9.0" }
filmcraft-frame = { path = "../frame", version = "0.9.0" }
filmcraft-dng = { path = "../dng", version = "0.9.0" }
rayon = { version = "1" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = { version = "2" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }

[dev-dependencies]
filmcraft-testkit = { path = "../testkit" }
filmcraft-dng = { path = "../dng", features = ["writer"], version = "0.9.0" }
# APNG fixtures for the animated-image tests (the image crate does not encode APNG)
png = "0.18"
