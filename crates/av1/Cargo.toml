[package]
name = "filmcraft-av1"
description = "Clean-room AV1 decoder (AV1 Bitstream & Decoding Process Specification v1.0.0 with Errata 1)"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { path = "../bitstream", version = "0.9.0" }
thiserror = { version = "2" }
rayon = { version = "1", optional = true }

[dev-dependencies]
filmcraft-testkit = { path = "../testkit" }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
