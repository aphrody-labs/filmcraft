[package]
name = "filmcraft-automation"
description = "MCP server (rmcp) over the FilmCraft engine, plus a bridge to the running app's control channel"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
filmcraft-engine = { path = "../engine", version = "0.9.0" }
filmcraft-time = { path = "../time", version = "0.9.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }
base64 = "0.22"
schemars = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
