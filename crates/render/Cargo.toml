[package]
name = "filmcraft-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
filmcraft-time = { path = "../time" }
filmcraft-geom = { path = "../geom" }
filmcraft-color = { path = "../color" }
filmcraft-frame = { path = "../frame" }
filmcraft-media = { path = "../media" }
filmcraft-project = { path = "../project" }
filmcraft-audio-dsp = { path = "../audio-dsp" }
filmcraft-captions = { path = "../captions" }
filmcraft-text = { path = "../text" }
rayon = { version = "1" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
