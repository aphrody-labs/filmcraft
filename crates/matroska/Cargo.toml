[package]
name = "filmcraft-matroska"
description = "Clean-room Matroska (MKV) and WebM demuxer and muxer"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]

[dev-dependencies]
filmcraft-testkit = { path = "../testkit" }
serde_json = { version = "1" }
