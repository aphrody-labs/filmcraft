[package]
name = "filmcraft-apv"
description = "Clean-room Advanced Professional Video (APV, IETF RFC 9924) decoder and encoder"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { path = "../bitstream" }
rayon = { version = "1", optional = true }
thiserror = { version = "2" }

[dev-dependencies]
filmcraft-testkit = { path = "../testkit" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

