[package]
name = "filmcraft-mpa"
description = "Clean-room MPEG-1/2 Audio Layer I and Layer II (MP1 / MP2) decoder"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
filmcraft-bitstream = { path = "../bitstream" }
thiserror = { version = "2" }

[dev-dependencies]
filmcraft-testkit = { path = "../testkit" }
