[package]
name = "filmcraft-hevc"
description = "Clean-room pure-Rust H.265/HEVC decoder (ITU-T H.265)"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { path = "../bitstream" }
thiserror = { version = "2" }
rayon = { version = "1", optional = true }

[dev-dependencies]
filmcraft-testkit = { path = "../testkit" }
