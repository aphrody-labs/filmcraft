[package]
name = "filmcraft-time"
description = "Exact media time for FilmCraft: integer ticks, rational frame rates and timecode."
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
serde = { version = "1", features = ["derive", "rc"] }

[dev-dependencies]
proptest = { version = "1" }
