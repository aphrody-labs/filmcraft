[package]
name = "filmcraft-audio-dsp"
description = "Real-time audio DSP for FilmCraft: BS.1770 / EBU R128 loudness metering and audio effects"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


# Intentionally dependency-free (layer L1): planar `&mut [f32]` slices in, planar slices out.
[dependencies]

[dev-dependencies]
filmcraft-testkit = { path = "../testkit" }
