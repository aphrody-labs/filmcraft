[package]
name = "filmcraft-mpeg2v"
description = "Clean-room MPEG-2 video (ITU-T H.262 | ISO/IEC 13818-2) and MPEG-1 video (ISO/IEC 11172-2) decoder"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
thiserror = { version = "2" }
rayon = { version = "1", optional = true }

[dev-dependencies]
filmcraft-testkit = { path = "../testkit" }
