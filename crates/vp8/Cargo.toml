[package]
name = "filmcraft-vp8"
description = "Clean-room pure-Rust VP8 decoder (RFC 6386)"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
thiserror = { version = "2" }
