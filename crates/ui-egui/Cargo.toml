[package]
name = "filmcraft-ui-egui"
description = "The FilmCraft egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
filmcraft-time = { path = "../time" }
filmcraft-geom = { path = "../geom" }
filmcraft-color = { path = "../color" }
filmcraft-frame = { path = "../frame" }
filmcraft-media = { path = "../media" }
filmcraft-project = { path = "../project" }
filmcraft-tts = { path = "../tts" }
filmcraft-edit = { path = "../edit" }
filmcraft-render = { path = "../render" }
filmcraft-text = { path = "../text" }
filmcraft-audio-dsp = { path = "../audio-dsp" }
filmcraft-engine = { path = "../engine" }
filmcraft-export = { path = "../export" }
filmcraft-gpu = { path = "../gpu" }
filmcraft-scopes = { path = "../scopes" }
egui = { version = "0.36" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1" }
log = { version = "0.4" }
rayon = { version = "1" }
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# ArtCraft wordmark (PNG) for the About dialog and Home screen.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "0.4"
filmcraft-codecs = { path = "../codecs" }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
filmcraft-platform = { path = "../platform" }
filmcraft-interchange = { path = "../interchange" }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { version = "1" }
toml = "1"
