[package]
name = "filmcraft-interchange"
description = "FilmCraft interchange: CMX 3600 EDL, Final Cut Pro 7 XML (xmeml), FCPXML and OpenTimelineIO import/export"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
filmcraft-time = { path = "../time", version = "0.9.0" }
filmcraft-geom = { path = "../geom", version = "0.9.0" }
filmcraft-color = { path = "../color", version = "0.9.0" }
filmcraft-media = { path = "../media", version = "0.9.0" }
filmcraft-project = { path = "../project", version = "0.9.0" }
filmcraft-cfb = { path = "../cfb", version = "0.9.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
roxmltree = { version = "0.21" }

[dev-dependencies]
proptest = { version = "1" }
